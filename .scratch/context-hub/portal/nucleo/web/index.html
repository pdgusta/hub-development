<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa de mapas</title>
<meta name="description" content="Mesa de mapas do projeto: o caminho até o destino, os tickets, as rodadas para responder, os designs, as decisões e os laços.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 46 46'%3E%3Ccircle cx='23' cy='23' r='22' fill='%23f3eadb'/%3E%3Cpath d='M23 3 L27 23 L23 43 L19 23 Z' fill='%237a4f2a'/%3E%3Cpath d='M3 23 L23 19 L43 23 L23 27 Z' fill='%23b98a5c'/%3E%3Cpath d='M23 3 L27 23 L23 23 Z' fill='%239c3a22'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/web/torre.css">
<script src="/web/vendor/marked.min.js"></script>
<script src="/web/vendor/purify.min.js"></script>
</head>
<body>
<a class="pular" href="#tela">Ir para o conteúdo</a>

<nav class="barra" aria-label="Telas">
  <a class="marca" href="#/torre" aria-label="Início">
    <svg viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="20" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".7"/><path d="M23 3 L27 23 L23 43 L19 23 Z" fill="currentColor"/><path d="M3 23 L23 19 L43 23 L23 27 Z" fill="currentColor" opacity=".6"/><path d="M23 3 L27 23 L23 23 Z" fill="#f3dcd3"/></svg>
  </a>
  <ul id="menu"></ul>
  <div class="barra-rodape">
    <span id="nome-projeto" class="nome-projeto"></span>
  </div>
</nav>

<header class="topo">
  <div id="rota-atual" class="rota-atual"></div>
  <div class="topo-direita">
    <a id="contador" class="contador" href="#/autorizacoes" aria-live="polite"></a>
    <button id="problemas" class="selo-problemas" type="button" hidden aria-haspopup="dialog"></button>
    <span id="ao-vivo" class="ao-vivo" title="atualiza sozinho a cada 3 segundos"></span>
  </div>
</header>

<div id="faixa-aviso" class="faixa-aviso" hidden></div>
<div id="leitura" class="leitura" role="status" aria-live="off"></div>

<main id="tela" class="tela" tabindex="-1"></main>

<aside id="gaveta" class="gaveta" hidden aria-label="Ticket"></aside>
<aside id="gaveta-no" class="gaveta gaveta-no" hidden aria-label="Nó do laço"></aside>
<div id="leitor" class="leitor" hidden role="dialog" aria-modal="true" aria-label="Carta"></div>
<div id="dialogo-problemas" class="dialogo" hidden role="dialog" aria-modal="true" aria-label="Problemas"></div>
<div id="dica" class="dica" role="tooltip" hidden></div>
<div id="brisa" class="brisa" aria-live="polite"></div>

<script type="module" src="/web/torre.js"></script>
</body>
</html>
