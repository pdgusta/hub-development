<!doctype html><html><head><meta charset="utf-8"><title>teste iframe sandbox</title><link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#888}iframe{border:0;position:fixed;left:0;top:0;width:100%;height:100%;display:block}</style></head>
<body><iframe sandbox="allow-scripts" src="http://127.0.0.1:8783/amostras/system-design-cidade.html"></iframe>
<script>/* #LxA fixa o tamanho do iframe (o --screenshot do Edge headless mede a janela antes de ajustar o viewport) */
var m = location.hash.match(/(\d+)x(\d+)/); if (m){ var f = document.querySelector('iframe'); f.style.width = m[1]+'px'; f.style.height = m[2]+'px'; }</script>
</body></html>
