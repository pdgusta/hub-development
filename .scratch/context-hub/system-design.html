<style>
:root{--bg:#070b16;--panel:#0b1020;--ink:#e2e8f0;--muted:#94a3b8;--line:#1e293b;--accent:#5eead4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cascadia Mono",Consolas,ui-monospace,monospace}
main{max-width:1680px;margin:0 auto;padding:22px 16px 28px}
.bar{width:46px;height:3px;background:var(--accent);margin-bottom:10px}
h1{margin:0;font-size:30px}
.sub{color:var(--muted);margin:6px 0 16px;font-size:14px}
.tag{float:right;color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.08em}
.frame{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto}
svg.topo{width:100%;min-width:900px;height:auto;display:block}
svg text{font-family:"Cascadia Mono",Consolas,ui-monospace,monospace}
.nt{font-size:15px;font-weight:700;fill:#f1f5f9}
.ns{font-size:11.5px;fill:#94a3b8}
.el{font-size:11px;font-weight:600}
.bl{font-size:12px;font-weight:700}
.gl{font-size:12.5px;font-weight:800;letter-spacing:.12em}
.pill{font-size:10.5px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 6px 2px;font-size:12.5px;color:var(--muted)}
.legend b{color:var(--ink);margin-right:6px}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:22px;height:12px;border:1.4px solid;border-radius:3px;display:inline-block}
</style>
