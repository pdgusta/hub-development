<style>
:root{
  --sea:#cfe5ee; --sea2:#b9d8e5; --ink:#1f2630; --ink2:#4a5562; --paper:#fffdf8;
  --blue:#2f6fb5; --terra:#b9552d; --violet:#6a4a9c; --ocre:#9a6a12; --graf:#6f7782;
  --f:"Outfit","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);color:var(--ink);font-family:var(--f)}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:default;background:var(--sea)}
#stage.panning{cursor:grabbing}
#sv{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
svg text{font-family:var(--f)}
.t-name{font-size:19.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:#fffdf8;stroke-width:5px;stroke-linejoin:round}
.t-word{font-size:19px;font-weight:600}
.t-pill{font-size:19px;font-weight:600}
.t-dist{font-size:21px;font-weight:800;letter-spacing:.16em}
.t-dist2{font-size:21px;font-weight:800;letter-spacing:.07em}
.t-note{font-size:19px;font-weight:500;fill:var(--ink2)}
.t-sign{font-size:19px;font-weight:600;fill:var(--ink)}
.bld{cursor:pointer;outline:none}
.bld .ring{opacity:0;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-dasharray:7 5}
.bld:hover .ring{opacity:.45}
.bld:focus-visible .ring,.bld.sel .ring{opacity:1;stroke:#1d5fae;stroke-width:3.2}
.bld .hit{fill:transparent}
.dimmed .bld:not(.lit),.dimmed .tag:not(.lit){opacity:.3}
.dimmed .edge:not(.lit),.dimmed .elab:not(.lit){opacity:.18}
.edge.lit .ln{stroke-width:4}
/* cartela, legenda, botão */
.panel{position:fixed;background:rgba(255,253,248,.94);border:1px solid rgba(31,38,48,.14);border-radius:14px;
  box-shadow:0 6px 18px rgba(25,60,80,.12);color:var(--ink);font-family:var(--f)}
#cartela{left:14px;bottom:14px;width:430px;padding:12px 16px 12px}
#cartela h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
#cartela p{margin:5px 0 0;font-size:14px;line-height:1.3;color:var(--ink2);font-weight:450}
#cartela .stamp{display:inline-block;margin-top:7px;padding:3px 10px;border-radius:999px;background:#e5eff8;color:#1d4f86;font-size:14px;font-weight:600}
#legenda{margin-top:9px;padding-top:7px;border-top:1px solid rgba(31,38,48,.12)}
#legenda b{display:block;font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--ink2);margin-bottom:4px}
#legenda ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,auto);justify-content:space-between;gap:3px 6px}
#legenda li{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:500;white-space:nowrap}
#legenda li svg{flex:none}
#fit{position:fixed;left:14px;top:14px;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 11px;
  background:rgba(255,253,248,.94);color:var(--ink);border:1px solid rgba(31,38,48,.18);border-radius:999px;box-shadow:0 4px 12px rgba(25,60,80,.12);
  font:600 15px/1 var(--f);cursor:pointer}
#fit:hover{background:#fff}
#fit:focus-visible{outline:3px solid #1d5fae;outline-offset:2px}
#ficha{position:fixed;top:14px;right:14px;width:min(440px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;z-index:5;
  background:#fffdf8;border:1px solid rgba(31,38,48,.16);border-radius:16px;box-shadow:0 14px 40px rgba(25,50,70,.22);
  padding:20px 22px 18px;font-family:var(--f);color:var(--ink)}
#ficha[hidden]{display:none}
#ficha .bar{position:absolute;left:0;top:0;right:0;height:7px;border-radius:16px 16px 0 0}
#ficha .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border:1px solid rgba(31,38,48,.2);background:#fff;border-radius:50%;
  font:500 24px/1 var(--f);cursor:pointer;color:var(--ink)}
#ficha .x:focus-visible{outline:3px solid #1d5fae;outline-offset:2px}
#ficha .head{display:flex;gap:14px;align-items:flex-start;padding-right:34px;margin-top:4px}
#ficha .ic{display:flex;gap:6px;flex:none}
#ficha .ic span{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;background:#fff;border:2px solid currentColor}
#ficha .ic svg{width:28px;height:28px;color:var(--ink)}
#ficha h2{margin:2px 0 0;font-size:27px;font-weight:700;line-height:1.1}
#ficha .subs{margin:8px 0 0;font-size:18px;color:var(--ink2);line-height:1.35}
#ficha .pill{display:inline-block;margin-top:10px;padding:3px 12px;border:1.5px solid currentColor;border-radius:999px;font-size:16px;font-weight:600}
#ficha .loc{margin:14px 0 2px;padding-top:12px;border-top:1px solid rgba(31,38,48,.12);display:flex;flex-wrap:wrap;gap:6px 8px}
#ficha .loc span{font-size:15px;padding:3px 10px;border-radius:999px;background:#eef1f4;color:var(--ink2);font-weight:500}
#ficha h3{margin:14px 0 6px;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:700}
#ficha ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
#ficha li{display:flex;align-items:center;gap:10px;font-size:17.5px}
#ficha li svg{flex:none;width:46px;height:12px}
#ficha li b{font-weight:600}
#ficha li i{font-style:normal;font-weight:600}
</style>
</head>

<div id="stage" aria-label="Mapa da cidade do context hub: botão direito arrasta, Ctrl e roda dá zoom, Tab percorre os prédios">

      inside = function(x, y){ var pq = planOf(x, y); return pq[0] > D.p0+6 && pq[0] < D.p1-6 && pq[1] > D.q0+6 && pq[1] < D.q1-6; };
    } else { R = P.region; core = S(P.core[0], P.core[1]); }
    var best = null;
    for (var p = R[0]+15; p <= R[1]-15; p += 15) for (var q = R[2]+15; q <= R[3]-15; q += 15){
      var a = S(p, q), r = {x:a[0]-w/2, y:a[1]-h/2, x2:a[0]+w/2, y2:a[1]+h/2};
      ROADW = .25; var s = scoreRect(r, "plate") * 4; ROADW = 1;
      // proibido cobrir prédio, medalhão, nome ou outra placa
      var rr = {x:r.x-4, y:r.y-4, x2:r.x2+4, y2:r.y2+4};

        for (var i=0;i<=10;i++) for (var j=0;j<=3;j++) if (inPoly(rr.x+(rr.x2-rr.x)*i/10, rr.y+(rr.y2-rr.y)*j/3, o.P)) return true; return false; })) s += 20;
      if (inside){ var out = 0, n = 0; for (var i=0;i<=4;i++) for (var j=0;j<=2;j++){ n++; if (!inside(r.x+(r.x2-r.x)*i/4, r.y+(r.y2-r.y)*j/2)) out++; } s += out/n * 10; }
      s += Math.hypot(a[0]-core[0], a[1]-core[1]) / 500;
      if (r.x < 600 && r.y2 > 720) s += 6; // canto da cartela (título e legenda) em 1280x800
      if (!best || s < best.s) best = {s:s, r:r};
    }
    drawPlate(P, best.r);
  });

var stage = document.getElementById("stage");

var view = {s:1, tx:0, ty:0}, fitted = true, MIN_S = .2, MAX_S = 4;
function apply(){ world.setAttribute("transform", "translate("+view.tx.toFixed(2)+" "+view.ty.toFixed(2)+") scale("+view.s.toFixed(4)+")"); }
function fitScale(){
  var vw = stage.clientWidth, vh = stage.clientHeight, pad = 0;
  var b = BOUNDS;
  return {s: Math.min((vw-2*pad)/b.w, (vh-2*pad)/b.h), bx:b.x, by:b.y, bw:b.w, bh:b.h, vw:vw, vh:vh};
}
function fit(){
  var f = fitScale();
  view.s = f.s; view.tx = (f.vw - f.bw*f.s)/2 - f.bx*f.s; view.ty = (f.vh - f.bh*f.s)/2 - f.by*f.s;
  fitted = true; apply();
}
function zoomAt(px, py, factor){
  var ns = Math.max(MIN_S, Math.min(MAX_S, view.s * factor));
  var k = ns / view.s;
  view.tx = px - (px - view.tx)*k; view.ty = py - (py - view.ty)*k; view.s = ns;
  fitted = false; apply();
}
function panBy(dx, dy){ view.tx += dx; view.ty += dy; fitted = false; apply(); }

stage.addEventListener("contextmenu", function(e){ e.preventDefault(); });

stage.addEventListener("pointermove", function(e){
  if (!drag || e.pointerId !== drag.id) return;
  panBy(e.clientX - drag.x, e.clientY - drag.y);
  drag.x = e.clientX; drag.y = e.clientY;
});
function endDrag(e){
  if (!drag || (e && e.pointerId !== drag.id)) return;

stage.addEventListener("wheel", function(e){

  var rect = stage.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey){

    panBy(-(dx || dy), 0);

  }
}, {passive:false});

function computeBounds(){

    if (!b.width) return;
    if (!bb) bb = {x:b.x, y:b.y, x2:b.x+b.width, y2:b.y+b.height};
    else { bb.x = Math.min(bb.x, b.x); bb.y = Math.min(bb.y, b.y); bb.x2 = Math.max(bb.x2, b.x+b.width); bb.y2 = Math.max(bb.y2, b.y+b.height); }
  });

}
