<style>
:root{
  --sea:#cfe5ee; --sea2:#b9d8e5; --ink:#1f2630; --ink2:#4a5562; --paper:#fffdf8;
  --blue:#2f6fb5; --terra:#b9552d; --violet:#6a4a9c; --ocre:#9a6a12; --graf:#6f7782;
  --f:"Outfit","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);color:var(--ink);font-family:var(--f)}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:default;background:var(--sea)}
#stage.panning{cursor:grabbing}
#sv{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
svg text{font-family:var(--f)}
.t-name{font-size:20px;font-weight:600;fill:var(--ink)}
.t-word{font-size:20px;font-weight:600;font-style:italic;paint-order:stroke;stroke:#fffdf8;stroke-width:5px;stroke-linejoin:round}
.t-pill{font-size:20px;font-weight:600}
.t-dist{font-size:21px;font-weight:800;letter-spacing:.16em}
.t-dist2{font-size:21px;font-weight:800;letter-spacing:.07em}
.t-note{font-size:20px;font-weight:500;fill:var(--ink2)}
.t-sign{font-size:20px;font-weight:600;fill:var(--ink)}
.bld{cursor:pointer;outline:none}
.bld .ring{opacity:0;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-dasharray:7 5}
.bld:hover .ring{opacity:.45}
.bld:focus-visible .ring,.bld.sel .ring{opacity:1;stroke:#1d5fae;stroke-width:3.2}
.bld .hit{fill:transparent}
.dimmed .bld:not(.lit),.dimmed .tag:not(.lit){opacity:.3}
.dimmed .edge:not(.lit),.dimmed .elab:not(.lit){opacity:.18}
.edge.lit .ln{stroke-width:4}
/* cartela, legenda, botão */
.panel{position:fixed;background:rgba(255,253,248,.94);border:1px solid rgba(31,38,48,.14);border-radius:14px;
  box-shadow:0 6px 18px rgba(25,60,80,.12);color:var(--ink);font-family:var(--f)}
#cartela{left:14px;top:14px;width:400px;padding:11px 15px 11px}
#cartela h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
#cartela p{margin:5px 0 0;font-size:14px;line-height:1.3;color:var(--ink2);font-weight:450}
#cartela .stamp{display:inline-block;margin-top:7px;padding:3px 10px;border-radius:999px;background:#e5eff8;color:#1d4f86;font-size:14px;font-weight:600}
#legenda{left:14px;bottom:14px;width:400px;padding:8px 14px 9px}
#legenda b{display:block;font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--ink2);margin-bottom:4px}
#legenda ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,auto);justify-content:space-between;gap:3px 6px}
#legenda li{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:500;white-space:nowrap}
#legenda li svg{flex:none}
#fit{position:fixed;right:14px;bottom:14px;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 11px;
  background:rgba(255,253,248,.94);color:var(--ink);border:1px solid rgba(31,38,48,.18);border-radius:999px;box-shadow:0 4px 12px rgba(25,60,80,.12);
  font:600 15px/1 var(--f);cursor:pointer}
#fit:hover{background:#fff}
#fit:focus-visible{outline:3px solid #1d5fae;outline-offset:2px}
#ficha{position:fixed;top:14px;right:14px;width:min(440px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;z-index:5;
  background:#fffdf8;border:1px solid rgba(31,38,48,.16);border-radius:16px;box-shadow:0 14px 40px rgba(25,50,70,.22);
  padding:20px 22px 18px;font-family:var(--f);color:var(--ink)}
#ficha[hidden]{display:none}
#ficha .bar{position:absolute;left:0;top:0;right:0;height:7px;border-radius:16px 16px 0 0}
#ficha .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border:1px solid rgba(31,38,48,.2);background:#fff;border-radius:50%;
  font:500 24px/1 var(--f);cursor:pointer;color:var(--ink)}
#ficha .x:focus-visible{outline:3px solid #1d5fae;outline-offset:2px}
#ficha .head{display:flex;gap:14px;align-items:flex-start;padding-right:34px;margin-top:4px}
#ficha .ic{display:flex;gap:6px;flex:none}
#ficha .ic span{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;background:#fff;border:2px solid currentColor}
#ficha .ic svg{width:28px;height:28px;color:var(--ink)}
#ficha h2{margin:2px 0 0;font-size:27px;font-weight:700;line-height:1.1}
#ficha .na-cidade{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:#f3f6ee;font-size:17.5px;line-height:1.35;color:var(--ink)}
#ficha .na-cidade b{font-weight:700}
#ficha .subs{margin:8px 0 0;font-size:18px;color:var(--ink2);line-height:1.35}
#ficha .pill{display:inline-block;margin-top:10px;padding:3px 12px;border:1.5px solid currentColor;border-radius:999px;font-size:16px;font-weight:600}
#ficha .loc{margin:14px 0 2px;padding-top:12px;border-top:1px solid rgba(31,38,48,.12);display:flex;flex-wrap:wrap;gap:6px 8px}
#ficha .loc span{font-size:15px;padding:3px 10px;border-radius:999px;background:#eef1f4;color:var(--ink2);font-weight:500}
#ficha h3{margin:14px 0 6px;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:700}
#ficha ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
#ficha li{display:flex;align-items:center;gap:10px;font-size:17.5px}
#ficha li svg{flex:none;width:46px;height:12px}
#ficha li b{font-weight:600}
#ficha li i{font-style:normal;font-weight:600}
</style>
</head>
<body>
<div id="stage" aria-label="Mapa da cidade do context hub: botão direito arrasta, Ctrl e roda dá zoom, Tab percorre os prédios">

    var p0 = p[(i-1+n)%n], p1 = p[i], p2 = p[(i+1)%n], p3 = p[(i+2)%n];
    if (!closed){ if (i === 0) p0 = p1; if (i+2 >= n) p3 = p2; }
    d += " C" + (p1[0]+(p2[0]-p0[0])/6).toFixed(1) + " " + (p1[1]+(p2[1]-p0[1])/6).toFixed(1) + " " +

}

function hull(P){
  P = P.slice().sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
  function cr(o,a,b){ return (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]); }
  var lo = [], hi = [];
  P.forEach(function(p){ while (lo.length >= 2 && cr(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); });
  P.slice().reverse().forEach(function(p){ while (hi.length >= 2 && cr(hi[hi.length-2], hi[hi.length-1], p) <= 0) hi.pop(); hi.push(p); });
  hi.pop(); lo.pop(); return lo.concat(hi);
}

function box(g, x, y, w, d, h, col, opt){
  opt = opt || {};
  var dash = opt.dash ? "7 5" : null, st = opt.stroke || ST, sw = opt.dash ? 1.8 : 1;
  el("rect", {x:x-w, y:y+d-h, width:2*w, height:h, fill:opt.front || col.l, stroke:st, "stroke-width":sw, "stroke-dasharray":dash}, g);
  el("rect", {x:x-w, y:y-d-h, width:2*w, height:2*d, rx:opt.rx || 3, fill:opt.roof || col.t, stroke:st, "stroke-width":sw, "stroke-dasharray":dash}, g);
  return {top:y-d-h, front:[y+d-h, y+d]};
}
function cyl(g, x, y, rx, h, col, opt){
  opt = opt || {}; var ry = rx*K*0.62;
  el("path", {d:"M"+(x-rx)+" "+(y-h)+"V"+y+"A"+rx+" "+ry+" 0 0 0 "+(x+rx)+" "+y+"V"+(y-h)+"Z", fill:col.l, stroke:ST}, g);
  if (opt.bands) opt.bands.forEach(function(f){ var yy = y - h*f; el("path", {d:"M"+(x-rx)+" "+yy+"A"+rx+" "+ry+" 0 0 0 "+(x+rx)+" "+yy, fill:"none", stroke:"rgba(255,255,255,.55)", "stroke-width":2}, g); });
  el("ellipse", {cx:x, cy:y-h, rx:rx, ry:ry, fill:col.t, stroke:ST}, g);

/* =====================================================================
   RUAS: cada rua é uma ligação; traçado reto entre lotes, anéis para as ruas em obras
   ===================================================================== */
function borderPoint(c, tx, ty, gap){ // ponto da borda do lote na direção de (tx, ty)
  var dx = tx - c.x, dy = ty - c.y, w = c.fp.w + (gap||8), d = c.fp.d + (gap||8);
  var s = Math.min(Math.abs(dx) > 1e-6 ? w/Math.abs(dx) : 1e9, Math.abs(dy) > 1e-6 ? d/Math.abs(dy) : 1e9);
  return [c.x + dx*s, c.y + dy*s];
}

/* =====================================================================
   CÂMERA: enquadrar, andar, zoom (mesmo encanamento da planta)
   ===================================================================== */
var stage = document.getElementById("stage");
var sv = document.getElementById("sv");
var view = {s:1, tx:0, ty:0}, fitted = true, MIN_S = .2, MAX_S = 4;
function apply(){ world.setAttribute("transform", "translate("+view.tx.toFixed(2)+" "+view.ty.toFixed(2)+") scale("+view.s.toFixed(4)+")"); }
function fitScale(){
  var vw = stage.clientWidth, vh = stage.clientHeight, pad = 0;
  var b = BOUNDS;
  return {s: Math.min((vw-2*pad)/b.w, (vh-2*pad)/b.h), bx:b.x, by:b.y, bw:b.w, bh:b.h, vw:vw, vh:vh};
}
function fit(){
  var f = fitScale();
  view.s = f.s; view.tx = (f.vw - f.bw*f.s)/2 - f.bx*f.s; view.ty = (f.vh - f.bh*f.s)/2 - f.by*f.s;
  fitted = true; apply();
}
function zoomAt(px, py, factor){
  var ns = Math.max(MIN_S, Math.min(MAX_S, view.s * factor));
  var k = ns / view.s;
  view.tx = px - (px - view.tx)*k; view.ty = py - (py - view.ty)*k; view.s = ns;
  fitted = false; apply();
}
function panBy(dx, dy){ view.tx += dx; view.ty += dy; fitted = false; apply(); }

stage.addEventListener("contextmenu", function(e){ e.preventDefault(); });
var drag = null;
stage.addEventListener("pointerdown", function(e){
  if (e.button !== 2) return;
  e.preventDefault();
  drag = {x:e.clientX, y:e.clientY, id:e.pointerId};
  try { stage.setPointerCapture(e.pointerId); } catch(err){}
  stage.classList.add("panning");
});
stage.addEventListener("pointermove", function(e){
  if (!drag || e.pointerId !== drag.id) return;
  panBy(e.clientX - drag.x, e.clientY - drag.y);
  drag.x = e.clientX; drag.y = e.clientY;
});
function endDrag(e){
  if (!drag || (e && e.pointerId !== drag.id)) return;
  try { stage.releasePointerCapture(drag.id); } catch(err){}
  drag = null; stage.classList.remove("panning");
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("wheel", function(e){
  e.preventDefault();
  var unit = e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? stage.clientHeight : 1);
  var dx = e.deltaX*unit, dy = e.deltaY*unit;
  var rect = stage.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey){
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.exp(-(dy || dx) * 0.0016));
  } else if (e.shiftKey){
    panBy(-(dx || dy), 0);
  } else {
    panBy(-dx, -dy);
  }
}, {passive:false});
document.getElementById("fit").addEventListener("click", function(){ fit(); });
window.addEventListener("resize", function(){ if (fitted) fit(); });

/* =====================================================================

var ficha = document.getElementById("ficha");
var openId = null, lastFocus = null, noEnsure = false;
function nameOf(id){ if (id.charAt(0) === "@") return roomById[id.slice(1)].name; return byId[id].t; }
function lineSample(kind){
  var k = KIND[kind];
  return '<svg viewBox="0 0 46 12" aria-hidden="true"><path d="M2 6H36" stroke="'+k.c+'" stroke-width="'+Math.min(k.w,3)+'" fill="none"'+
    (k.d ? ' stroke-dasharray="'+k.d+'"' : '')+(k.cap ? ' stroke-linecap="round"' : '')+'/><path d="M32 2L44 6L32 10L35 6z" fill="'+k.c+'"/></svg>';
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function iconSvg(id, col){ return '<span style="color:'+col+'"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#'+id+'"/></svg></span>'; }
function openCard(id){

    if (o.both){ if (e[1] === id) ins.push({o:e[2], l:lab, k:e[4]}); if (e[2] === id) outs.push({o:e[1], l:lab, k:e[4]}); }
  });
  function li(x){ return '<li data-de="'+esc(x.o)+'">'+lineSample(x.k)+'<b>'+esc(nameOf(x.o))+'</b>'+(x.l ? '<i style="color:'+KIND[x.k].c+'">'+esc(x.l)+'</i>' : '')+'</li>'; }
  var room = roomById[c.room], col = PAL[c.role].k;
  var html = '<div class="bar" style="background:'+col+'"></div><button class="x" type="button" aria-label="fechar">×</button>';
  html += '<div class="head">';

  html += '<div><h2 id="fT">'+esc(c.t)+'</h2>';

  if (c.pill) html += '<span class="pill" style="color:'+(c.pill.open ? "#b9552d" : "#3c4652")+'">'+esc(c.pill.t)+'</span>';
  html += '</div></div>';
  html += '<div class="loc"><span>'+esc(c.kind === "rule" ? RULES : room.name)+'</span><span class="role">'+esc(ROLE[c.role])+'</span>'+(room.par ? '<span>'+esc(PAR1)+'</span>' : '')+(c.front ? '<span>'+esc(FRONT)+'</span>' : '')+'</div>';
  if (ins.length) html += '<h3>chega de</h3><ul class="ins">'+ins.map(li).join("")+'</ul>';
  if (outs.length) html += '<h3>vai para</h3><ul class="outs">'+outs.map(li).join("")+'</ul>';
  ficha.innerHTML = html;
  ficha.hidden = false;
  ficha.querySelector(".x").addEventListener("click", closeCard);
  world.classList.add("dimmed");
  var lit = {}; lit[id] = 1;
  Array.prototype.forEach.call(world.querySelectorAll(".edge"), function(g){
    var on = g.getAttribute("data-from") === id || g.getAttribute("data-to") === id || (id === "contrato" && g.getAttribute("data-id") === "e6");
    g.classList.toggle("lit", on);
    if (on){ lit[g.getAttribute("data-from")] = 1; lit[g.getAttribute("data-to")] = 1; }
    var lab = world.querySelector('.elab[data-id="'+g.getAttribute("data-id")+'"]'); if (lab) lab.classList.toggle("lit", on);
  });
  var pairLab = world.querySelector('.elab[data-id="pair"]'); if (pairLab) pairLab.classList.toggle("lit", id === "couch" || id === "par2");
  CARDS.forEach(function(k){ if (!k.g) return; k.g.classList.toggle("lit", !!lit[k.id]); k.g.classList.toggle("sel", k.id === id);
    if (k.tagG) k.tagG.classList.toggle("lit", !!lit[k.id]); });
  ficha.querySelector(".x").focus({preventScroll:true});
}
function closeCard(){
  if (!openId) return;
  openId = null; ficha.hidden = true; ficha.innerHTML = "";
  world.classList.remove("dimmed");
  Array.prototype.forEach.call(world.querySelectorAll(".lit,.sel"), function(n){ n.classList.remove("lit"); n.classList.remove("sel"); });
  if (lastFocus){ noEnsure = true; try { lastFocus.focus({preventScroll:true}); } catch(e){} noEnsure = false; }
}
function boxOf(c){ // caixa do prédio em coordenadas do mundo
  try { var b = c.g.getBBox(); return {x:b.x, y:b.y, w:b.width, h:b.height}; } catch(e){ return {x:0,y:0,w:10,h:10}; }
}
function ensureVisible(c){
  var vw = stage.clientWidth, vh = stage.clientHeight, m = 30, b = boxOf(c);
  var x1 = view.tx + b.x*view.s, y1 = view.ty + b.y*view.s, x2 = x1 + b.w*view.s, y2 = y1 + b.h*view.s;
  if (x1 < m || y1 < m || x2 > vw - m || y2 > vh - m){
    view.tx = vw/2 - (b.x + b.w/2)*view.s; view.ty = vh/2 - (b.y + b.h/2)*view.s; fitted = false; apply();
  }
}
var FOCUS_ORDER = ["gustavo","agentes","clientes","obsidian","sessao","mcpro","contrato","fork","gversao","busca","diverg",
  "vista","sync","couch","vigia","piorar","modfixo","r1","r2","r3","par2","github","mstar","pecas","gacervo","registro","maestri","propostas"];
// ordem do Tab = ordem de leitura (oeste → leste, depois rede e acervo)
FOCUS_ORDER.forEach(function(id, i){ var c = byId[id]; if (c && c.g) c.g.setAttribute("data-ord", i); });
(function(){ // reordena os focáveis no DOM sem mudar a pintura: tabindex positivo seria frágil, então usamos um anel de foco próprio
  var list = FOCUS_ORDER.map(function(id){ return byId[id].g; });
  list.forEach(function(g, i){
    g.addEventListener("keydown", function(e){
      if (e.key !== "Tab") return;
      var j = i + (e.shiftKey ? -1 : 1);
      if (j < 0 || j >= list.length) return; // sai do mapa normalmente
      e.preventDefault(); list[j].focus({preventScroll:true});
    });
  });

})();
CARDS.forEach(function(c){
  if (!c.g) return;
  c.g.addEventListener("click", function(e){ if (e.button !== 0) return; e.stopPropagation(); openCard(c.id); });
  c.g.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openCard(c.id); } });

});
stage.addEventListener("click", function(e){ if (e.button === 0 && openId) closeCard(); });
document.addEventListener("keydown", function(e){
  if (e.key === "Escape"){ if (openId){ e.preventDefault(); closeCard(); } return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var a = document.activeElement;
  if (e.key === "Tab" && !e.shiftKey && (!a || a === document.body || a.id === "stage")){ e.preventDefault(); stage.__first.focus({preventScroll:true}); return; }
  if (e.key === "0"){ e.preventDefault(); fit(); }
  else if (e.key === "+" || e.key === "="){ zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1.2); }
  else if (e.key === "-"){ zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1/1.2); }
});

/* =====================================================================
   INÍCIO
   ===================================================================== */
function layoutAll(){ placeLabels(); computeBounds(); }
function computeBounds(){
  var bb = null;
  // só geometria que não depende da fonte: ilhas, prédios, quadro e as caixas calculadas das etiquetas
  var boxes = [];
  ["land","buildings","board"].forEach(function(id){ var n = document.getElementById(id); if (!n) return; try { boxes.push(n.getBBox()); } catch(e){} });
  OB.rects.forEach(function(r){ boxes.push({x:r.x, y:r.y, width:r.x2-r.x, height:r.y2-r.y}); });
  boxes.forEach(function(b){
    if (!b.width) return;
    if (!bb) bb = {x:b.x, y:b.y, x2:b.x+b.width, y2:b.y+b.height};
    else { bb.x = Math.min(bb.x, b.x); bb.y = Math.min(bb.y, b.y); bb.x2 = Math.max(bb.x2, b.x+b.width); bb.y2 = Math.max(bb.y2, b.y+b.height); }
  });
  // enquadramento centrado no cofre: a praça do meio fica no meio da tela
  if (bb){ var hx = Math.max(-bb.x, bb.x2) + 12, hy = Math.max(-bb.y, bb.y2) + 12; BOUNDS = {x:-hx, y:-hy, w:2*hx, h:2*hy}; }
}
layoutAll(); fit();

try {

  if (!ok || laidWithFont) return;

}

window.__cidade = { view: function(){ return {s:view.s, tx:view.tx, ty:view.ty}; }, fit: fit, fitScale: function(){ return fitScale().s; },
  open: openCard, close: closeCard, cards: CARDS.map(function(c){ return c.id; }), edges: EDGES, route: ROUTE,

  boxOf: function(id){ return boxOf(byId[id]); }, bounds: function(){ return BOUNDS; },
  radial: function(){ return CARDS.filter(function(c){ return c.form; }).map(function(c){ return {id:c.id, lvl:c.lvl, x:c.x, y:c.y, anel:ringOf(c.x, c.y)}; }); },
  tags: function(){ return TAGS; }, hulls: function(){ var o = {}; CARDS.forEach(function(c){ if (c.hull) o[c.id] = c.hull; }); return o; },
  analogia: function(){ var o = {}; CARDS.forEach(function(c){ o[c.id] = {cidade:c.city, porque:c.why}; }); return o; },
  chao: function(){ return [-330, 50]; },
  measured: function(){ MEASURED = {}; var keep = WIDTHS; WIDTHS = null; layoutAll(); WIDTHS = keep; return MEASURED; } };
window.__S = function(x, y){ return [x, y]; };
window.__planta = window.__cidade;
})();
