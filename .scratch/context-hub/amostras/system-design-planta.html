<style>
:root{
  --paper:#f2eee2; --sheet:#f6f3ea; --card:#fbf9f3;
  --ink:#1d232b; --ink2:#46505c; --blue:#1f4f8f; --terra:#b4532a; --violet:#6a4a9c; --graf:#7c8189;
  --grid1:rgba(52,96,140,.09); --grid2:rgba(52,96,140,.2);
  --f:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --hand:"Architects Daughter","Segoe Print","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--f)}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:default;background:var(--paper)}
#stage.panning{cursor:grabbing}
#sv{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
svg text{font-family:var(--f)}
.t-room{font-size:21px;font-weight:600;letter-spacing:.07em;fill:var(--ink)}
.t-note{font-size:18.5px;font-weight:500;fill:var(--ink2)}
.t-title{font-size:21px;font-weight:700;fill:var(--ink)}
.t-sub{font-size:18.5px;font-weight:500;fill:var(--ink2)}
.t-pill{font-size:18.5px;font-weight:600}
.t-lab{font-size:18.5px;font-weight:600;paint-order:stroke;stroke:var(--sheet);stroke-width:7px;stroke-linejoin:round}
.t-rule{font-size:18.5px;font-weight:700}
.t-hand{font-family:var(--hand)}
.card{cursor:pointer;outline:none}
.card .fr{transition:stroke-width .12s}
.card:hover .fr{stroke-width:2.6}
.card:focus-visible .fr,.card.sel .fr{stroke:var(--blue);stroke-width:3.4}
.card:focus-visible .ring{opacity:1}
.ring{opacity:0;fill:none;stroke:var(--blue);stroke-width:1.4;stroke-dasharray:4 4}
.dimmed .card:not(.lit){opacity:.28}
.dimmed .edge:not(.lit){opacity:.16}
.dimmed .elab:not(.lit){opacity:.16}
.edge.lit .ln{stroke-width:3.4}
/* UI */
#fit{position:fixed;left:14px;bottom:14px;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;
  background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:3px;box-shadow:3px 3px 0 rgba(29,35,43,.18);
  font:600 15px/1 var(--f);letter-spacing:.04em;cursor:pointer}
#fit:hover{background:#fff}
#fit:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#ficha{position:fixed;top:14px;right:14px;width:min(430px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;
  background:var(--card);border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:-7px;
  box-shadow:6px 6px 0 rgba(29,35,43,.16);padding:22px 24px 20px;font-family:var(--f);color:var(--ink)}
#ficha[hidden]{display:none}
#ficha .x{position:absolute;top:10px;right:12px;width:34px;height:34px;border:1.5px solid var(--ink);background:var(--sheet);
  font:600 22px/1 var(--f);cursor:pointer;border-radius:2px;color:var(--ink)}
#ficha .x:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#ficha .head{display:flex;gap:16px;align-items:flex-start;padding-right:30px}
#ficha .ic{display:flex;gap:8px;flex:none;color:var(--ink)}
#ficha .ic svg{width:52px;height:52px}
#ficha h2{margin:0;font:400 31px/1.08 var(--hand);color:var(--ink)}
#ficha .subs{margin:8px 0 0;font-size:19px;color:var(--ink2);line-height:1.3}
#ficha .pill{display:inline-block;margin-top:10px;padding:3px 12px;border:1.5px solid currentColor;border-radius:999px;font-size:17px;font-weight:600}
#ficha .loc{margin:16px 0 4px;padding-top:12px;border-top:1px dashed var(--ink2);font-size:17px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px 10px}
#ficha .loc span{border:1px solid var(--ink2);padding:2px 8px;border-radius:2px;letter-spacing:.03em}
#ficha h3{margin:16px 0 6px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:700}
#ficha ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
#ficha li{display:flex;align-items:center;gap:10px;font-size:19px}
#ficha li svg{flex:none;width:46px;height:12px}
#ficha li b{font-weight:700}
#ficha li i{font-style:normal;font-weight:600}
</style>
</head>

  c.w = w; c.h = h;
  var aria = c.t + (c.s ? ": " + c.s.join(", ") : "");
  var g = el("g", {"class":"card", tabindex:0, role:"button", "aria-label":aria, "data-id":c.id}, gCards);
  c.g = g;
  el("rect", {"class":"ring", x:c.x-6, y:c.y-6, width:w+12, height:h+12, rx:3}, g);
  el("rect", {x:c.x+4, y:c.y+4, width:w, height:h, fill:"#1d232b", opacity:.07}, g);
  el("rect", {"class":"fr", x:c.x, y:c.y, width:w, height:h, fill:"var(--card)", stroke:"#1d232b", "stroke-width":1.7,
     "stroke-dasharray": c.dashed ? "9 5" : null}, g);
  if (kind === "chip"){
    useIcon(g, c.ic[0], c.x+9, c.y+10, 20);
    txt(g, c.x+36, c.y+27, c.t, "t-sub", {style:"fill:#1d232b;font-weight:600", "data-maxw":w-44});
    return;
  }
  var band = kind === "rule" ? 7 : 12;
  el("rect", {x:c.x+.9, y:c.y+.9, width:band, height:h-1.8, fill:roleFill(c.role)}, g);
  el("path", {d:"M"+(c.x+band+.9)+" "+c.y+"v"+h, stroke:"#1d232b", "stroke-width":1}, g);
  if (kind === "rule"){
    txt(g, c.x+19, c.y+22, c.t, "t-rule", {fill:"#1d232b", "data-maxw":w-28});
    c.s.forEach(function(s, i){ txt(g, c.x+19, c.y+22+20*(i+1), s, "t-sub", {"data-maxw":w-28}); });
    return;
  }
  var ix = c.x+22;
  c.ic.forEach(function(id, i){ useIcon(g, id, ix + i*34, c.y+9, 28); });
  var tx0 = ix + c.ic.length*34 + 4;
  txt(g, tx0, c.y+32, c.t, "t-title", {"data-maxw": c.x+w-10-tx0});
  c.s.forEach(function(s, i){ txt(g, c.x+22, c.y+59+23*i, s, "t-sub", {"data-maxw": w-32}); });
  if (c.pill){
    var col = c.pill.open ? "#b4532a" : "#1d232b";
    var pg = el("g", {"class":"pill"}, g);
    var pr = el("rect", {x:c.x+w-110, y:c.y-14, width:100, height:28, rx:3, fill:"var(--card)", stroke:col, "stroke-width":1.6}, pg);
    var ph = el("circle", {cx:c.x+w-101, cy:c.y, r:3, fill:"none", stroke:col, "stroke-width":1.4}, pg);
    var pt = txt(pg, c.x+w-92, c.y+1, c.pill.t, "t-pill", {"dominant-baseline":"central", fill:col});
    c.pillParts = [pr, ph, pt];
  }
});
function layoutPills(){
  CARDS.forEach(function(c){
    if (!c.pillParts) return;
    var pr = c.pillParts[0], ph = c.pillParts[1], pt = c.pillParts[2];
    var tw = 60; try { tw = pt.getComputedTextLength(); } catch(e){}
    var pw = Math.ceil(tw + 30), x0 = c.x + c.w - 10 - pw;
    pr.setAttribute("x", x0); pr.setAttribute("width", pw);
    ph.setAttribute("cx", x0 + 9); pt.setAttribute("x", x0 + 19);
  });
}

/* ---------- ajuste de texto (nunca vaza da placa) ---------- */
function squeeze(){
  var list = world.querySelectorAll("text[data-maxw]");
  for (var i=0;i<list.length;i++){
    var t = list[i], mw = +t.getAttribute("data-maxw");
    t.removeAttribute("textLength"); t.removeAttribute("lengthAdjust");
    var len = 0; try { len = t.getComputedTextLength(); } catch(e){}
    if (len > mw){ t.setAttribute("textLength", mw); t.setAttribute("lengthAdjust", "spacingAndGlyphs"); }
  }
  layoutPills();
}

/* ---------- câmera: enquadrar, andar, zoom ---------- */
var stage = document.getElementById("stage");
var sv = document.getElementById("sv");
var view = {s:1, tx:0, ty:0}, fitted = true, MIN_S = .2, MAX_S = 4;
function apply(){ world.setAttribute("transform", "translate("+view.tx.toFixed(2)+" "+view.ty.toFixed(2)+") scale("+view.s.toFixed(4)+")"); }
function fitScale(){
  var vw = stage.clientWidth, vh = stage.clientHeight, pad = 6;
  var bx = -11, by = -11, bw = W+22, bh = H+22;
  return {s: Math.min((vw-2*pad)/bw, (vh-2*pad)/bh), bx:bx, by:by, bw:bw, bh:bh, vw:vw, vh:vh};
}
function fit(){
  var f = fitScale();
  view.s = f.s; view.tx = (f.vw - f.bw*f.s)/2 - f.bx*f.s; view.ty = (f.vh - f.bh*f.s)/2 - f.by*f.s;
  fitted = true; apply();
}
function zoomAt(px, py, factor){
  var ns = Math.max(MIN_S, Math.min(MAX_S, view.s * factor));
  var k = ns / view.s;
  view.tx = px - (px - view.tx)*k; view.ty = py - (py - view.ty)*k; view.s = ns;
  fitted = false; apply();
}
function panBy(dx, dy){ view.tx += dx; view.ty += dy; fitted = false; apply(); }

stage.addEventListener("contextmenu", function(e){ e.preventDefault(); });
var drag = null;
stage.addEventListener("pointerdown", function(e){
  if (e.button !== 2) return;
  e.preventDefault();
  drag = {x:e.clientX, y:e.clientY, id:e.pointerId};
  try { stage.setPointerCapture(e.pointerId); } catch(err){}
  stage.classList.add("panning");
});
stage.addEventListener("pointermove", function(e){
  if (!drag || e.pointerId !== drag.id) return;
  panBy(e.clientX - drag.x, e.clientY - drag.y);
  drag.x = e.clientX; drag.y = e.clientY;
});
function endDrag(e){
  if (!drag || (e && e.pointerId !== drag.id)) return;
  try { stage.releasePointerCapture(drag.id); } catch(err){}
  drag = null; stage.classList.remove("panning");
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("wheel", function(e){
  e.preventDefault();
  var unit = e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? stage.clientHeight : 1);
  var dx = e.deltaX*unit, dy = e.deltaY*unit;
  var rect = stage.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey){
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.exp(-(dy || dx) * 0.0016));
  } else if (e.shiftKey){
    panBy(-(dx || dy), 0);
  } else {
    panBy(-dx, -dy);
  }
}, {passive:false});
document.getElementById("fit").addEventListener("click", function(){ fit(); });
window.addEventListener("resize", function(){ if (fitted) fit(); });

/* ---------- ficha do card ---------- */
var ficha = document.getElementById("ficha");
var openId = null, lastFocus = null;
function nameOf(id){ if (id.charAt(0) === "@") return roomById[id.slice(1)].name; return byId[id].t; }
function lineSample(kind){
  var k = KIND[kind];
  return '<svg viewBox="0 0 46 12" aria-hidden="true"><path d="M2 6H36" stroke="'+k.c+'" stroke-width="'+Math.min(k.w,3)+'" fill="none"'+
    (k.d ? ' stroke-dasharray="'+k.d+'"' : '')+(k.cap ? ' stroke-linecap="round"' : '')+'/><path d="M32 2L44 6L32 10L35 6z" fill="'+k.c+'"/></svg>';
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function iconSvg(id){ return '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#'+id+'"/></svg>'; }
function openCard(id){
  var c = byId[id]; if (!c) return;
  openId = id;
  lastFocus = c.g;
  var ins = [], outs = [];
  EDGES.forEach(function(e){
    var lab = e[3] || ((e[7]||{}).pair ? "cada uma empurra" : "");
    if (e[2] === id) ins.push({o:e[1], l:lab, k:e[4]});
    if (e[1] === id) outs.push({o:e[2], l:lab, k:e[4]});
    if ((e[7]||{}).both){ if (e[1] === id) ins.push({o:e[2], l:lab, k:e[4]}); if (e[2] === id) outs.push({o:e[1], l:lab, k:e[4]}); }
  });
  function li(x){ return '<li>'+lineSample(x.k)+'<b>'+esc(nameOf(x.o))+'</b>'+(x.l ? '<i style="color:'+KIND[x.k].c+'">'+esc(x.l)+'</i>' : '')+'</li>'; }
  var room = roomById[c.room];
  var html = '<button class="x" type="button" aria-label="fechar">×</button>';
  html += '<div class="head">';
  if (c.ic) html += '<div class="ic">'+c.ic.map(iconSvg).join("")+'</div>';
  html += '<div><h2 id="fT">'+esc(c.t)+'</h2>';
  if (c.s) html += '<div class="subs">'+c.s.map(esc).join("<br>")+'</div>';
  if (c.pill) html += '<span class="pill" style="color:'+(c.pill.open ? "#b4532a" : "#1d232b")+'">'+esc(c.pill.t)+'</span>';
  html += '</div></div>';
  html += '<div class="loc"><span>'+esc(room.name)+'</span><span>'+esc(ROLE[c.role])+'</span>'+(room.par ? '<span>'+esc(PAR1)+'</span>' : '')+(c.front ? '<span>'+esc(FRONT)+'</span>' : '')+'</div>';
  if (ins.length) html += '<h3>chega de</h3><ul>'+ins.map(li).join("")+'</ul>';
  if (outs.length) html += '<h3>vai para</h3><ul>'+outs.map(li).join("")+'</ul>';
  ficha.innerHTML = html;
  ficha.hidden = false;
  ficha.querySelector(".x").addEventListener("click", closeCard);
  // destaque no desenho
  world.classList.add("dimmed");
  var lit = {}; lit[id] = 1;
  Array.prototype.forEach.call(world.querySelectorAll(".edge"), function(g){
    var on = g.getAttribute("data-from") === id || g.getAttribute("data-to") === id;
    g.classList.toggle("lit", on);
    if (on){ lit[g.getAttribute("data-from")] = 1; lit[g.getAttribute("data-to")] = 1; }
    var lab = world.querySelector('.elab[data-id="'+g.getAttribute("data-id")+'"]'); if (lab) lab.classList.toggle("lit", on);
  });
  var pairLab = world.querySelector('.elab[data-id="pair"]'); if (pairLab) pairLab.classList.toggle("lit", id === "couch" || id === "par2");
  CARDS.forEach(function(k){ k.g.classList.toggle("lit", !!lit[k.id]); k.g.classList.toggle("sel", k.id === id); });
  ficha.querySelector(".x").focus({preventScroll:true});
}
function closeCard(){
  if (!openId) return;
  openId = null; ficha.hidden = true; ficha.innerHTML = "";
  world.classList.remove("dimmed");
  CARDS.forEach(function(k){ k.g.classList.remove("lit"); k.g.classList.remove("sel"); });
  Array.prototype.forEach.call(world.querySelectorAll(".lit"), function(n){ n.classList.remove("lit"); });
  if (lastFocus) try { lastFocus.focus({preventScroll:true}); } catch(e){}
}
CARDS.forEach(function(c){
  c.g.addEventListener("click", function(e){ if (e.button !== 0) return; e.stopPropagation(); openCard(c.id); });
  c.g.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openCard(c.id); } });
  c.g.addEventListener("focus", function(){ ensureVisible(c); });
});
stage.addEventListener("click", function(e){ if (e.button === 0 && openId) closeCard(); });
function ensureVisible(c){
  var vw = stage.clientWidth, vh = stage.clientHeight, m = 30;
  var x1 = view.tx + c.x*view.s, y1 = view.ty + c.y*view.s, x2 = x1 + c.w*view.s, y2 = y1 + c.h*view.s;
  if (x1 < m || y1 < m || x2 > vw - m || y2 > vh - m){
    view.tx = vw/2 - (c.x + c.w/2)*view.s; view.ty = vh/2 - (c.y + c.h/2)*view.s; fitted = false; apply();
  }
}
document.addEventListener("keydown", function(e){
  if (e.key === "Escape"){ if (openId){ e.preventDefault(); closeCard(); } return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "0"){ e.preventDefault(); fit(); }
  else if (e.key === "+" || e.key === "="){ zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1.2); }
  else if (e.key === "-"){ zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1/1.2); }
});
// nada de rolagem do documento, mesmo com foco em algo fora da tela
window.addEventListener("scroll", function(){ if (window.scrollX || window.scrollY) window.scrollTo(0,0); });

/* ---------- início ---------- */
squeeze(); fit();
try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ squeeze(); }); } catch(e){}
setTimeout(squeeze, 1500);
window.__planta = { view: function(){ return {s:view.s, tx:view.tx, ty:view.ty}; }, fit: fit, fitScale: function(){ return fitScale().s; } };
})();
